[project]
name = "unified-portal-gateway"
version = "0.1.0"
description = "统一门户网关 — 反向代理路由 + 企微OAuth SSO + 三层权限判定 + 访问日志（队列#162，决策件§六线②地基线）"
requires-python = ">=3.11"
authors = [{ name = "卓品智能 AI 转型项目" }]
# 平台底座以可编辑方式安装：
#   pip install -e ../zhuopin_platform
#   pip install -e .
# 之后 from zhuopin_platform... / from portal_gateway... import
dependencies = [
    "zhuopin_platform",
    "flask>=3.0",
    "waitress>=3.0",   # 生产模式 WSGI server（同 SC8/QD-B/FI2 惯例）
    "requests>=2.31",  # 反向代理转发 + 企微 OAuth API 调用
    "pyyaml>=6.0",      # department_mapping.yaml 加载
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["portal_gateway*"]

[tool.setuptools.package-data]
portal_gateway = ["department_mapping.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
