[project]
name = "sc4-contract-clause-extraction"
version = "0.1.0"
description = "SC4 合同条款自动提取与审核数字员工 — 骨架期（前置未到位，只落不依赖法务判据的解析/抽取层），import 底座 audit"
requires-python = ">=3.11"
authors = [{ name = "卓品智能 AI 转型项目" }]
# 平台底座以可编辑方式安装（可选，仅利于 IDE 补全；pytest/入口靠 conftest 引导）：
#   pip install -e ../../../5-平台底座/zhuopin_platform
dependencies = [
    "zhuopin_platform",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sc4_contract*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
