[project]
name = "sc1-supplier-risk-screening"
version = "0.1.0"
description = "SC1 供应商风险初筛数字员工 — L2 AI 评估 + 全链审计（平台底座对齐版）"
requires-python = ">=3.11"
authors = [{ name = "卓品智能 AI 转型项目" }]
# 平台底座以可编辑方式安装：
#   pip install -e ../../../5-平台底座/zhuopin_platform
#   pip install -e .
# 第三方依赖仍由 requirements.txt 管理（openai / requests / python-dotenv）
dependencies = [
    "zhuopin_platform",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
