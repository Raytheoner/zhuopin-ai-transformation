[project]
name = "sc3-intransit-tracking"
version = "0.1.0"
description = "SC3 供应商在途跟踪与绩效数字员工 — 收割 supplychain supplier_tracking，import 底座 models/audit，mock CSV 验证三色风险"
requires-python = ">=3.11"
authors = [{ name = "卓品智能 AI 转型项目" }]
# 平台底座以可编辑方式安装：
#   pip install -e ../../../5-平台底座/zhuopin_platform
#   pip install -e .
dependencies = [
    "zhuopin_platform",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sc3_intransit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
