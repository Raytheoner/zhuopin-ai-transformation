[project]
name = "sc5-purchase-recommendation"
version = "0.1.0"
description = "SC5 采购建议与供应商遴选数字员工 — 收割 supplychain purchase_recommendation，import 底座 kit_engine/models/audit"
requires-python = ">=3.11"
authors = [{ name = "卓品智能 AI 转型项目" }]
# 平台底座以可编辑方式安装：
#   pip install -e ../../../5-平台底座/zhuopin_platform
#   pip install -e .
dependencies = [
    "zhuopin_platform",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sc5_purchase*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
