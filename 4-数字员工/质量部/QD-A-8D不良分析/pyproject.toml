[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qda-8d-prefill"
version = "0.1.0"
description = "QD-A 8D预填工具 — 历史8D库归集提速"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.0",
    "pdfplumber>=0.10",
    "python-pptx>=1.0",   # 8D 原始报告为 .pptx（轨 A 校准输入）
    "openpyxl>=3.1",      # 读 xlsx「8D历史库录入表」人工标准答案
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
