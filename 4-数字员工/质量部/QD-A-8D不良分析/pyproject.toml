[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qda-8d-prefill"
version = "0.1.0"
description = "QD-A 8D预填工具 — 历史8D库归集提速"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.0",
    "pdfplumber>=0.10",
    "python-pptx>=1.0",   # 8D 原始报告为 .pptx（轨 A 校准输入）
    "openpyxl>=3.1",      # 读 xlsx「8D历史库录入表」人工标准答案
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# setuptools 自动发现在 flat-layout 下把 data/（真实 8D 样本的 gitignore
# 占位目录，见本场景 CLAUDE.md 红线①，只含 data/golden/.gitkeep）误判为
# 第二个顶层包，拒绝猜测、build 直接失败；显式声明只打包 qda_prefill，
# 与 5-平台底座/zhuopin_platform/pyproject.toml 的既有写法同一约定。
[tool.setuptools.packages.find]
include = ["qda_prefill*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
