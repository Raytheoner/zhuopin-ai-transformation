[project]
name = "fi8-cashflow-forecast"
version = "0.1.0"
description = "FI8 现金流预测与智能预警（骨架）— 4/8/12 周滚动预测 + 资金缺口窗口 + 催收 escalation + what-if"
requires-python = ">=3.11"
authors = [{ name = "卓品智能 AI 转型项目" }]
dependencies = [
    "zhuopin_platform",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["fi8_cashflow_forecast*"]
