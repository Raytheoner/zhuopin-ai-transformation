schema: spec-driven

rules:
  proposal:
    - >-
      MANDATORY: proposal.md 必须包含以下两个强制节，缺任一节视为 proposal 不完整、不进入 design
      审（来源：openspec/templates/proposal-template.md，Antigravity 评审整改项 ④，2026-07-04 起生效）。
    - >-
      节一 `## 知识资产三问（强制，全景规划 §1.4 第 2 条）`：必须在该节下回答三个问题——本流程哪些判断是
      人脑默会经验？（列出规则/阈值/例外/尺度）由谁显性化？（持有人 + backup 双人制，实名）用什么方法提取？
      （AI起草·专家批改 / 历史案例反推 / L2改判判例累积，三选一或组合）
    - >-
      节二 `## 验收与晋档条件（强制，四档口径）`：必须在该节下填写三项——本变更包交付后场景所处档位（档1
      mock验证 / 档2 真实数据跑通 / 档3 内部服务 / 档4 对客交付）；晋下一档的条件（数据/签字/门禁前提，
      逐条）；价值指标（工时型 / 质量型 / 风险型，基线由业务 Champion 确认）。
    - >-
      这两节必须以完整章节标题+正文内容的形式真实出现在生成的 proposal.md 文件里——它们不是仅供你参考的
      背景信息，而是本项目对 proposal.md 产出结构的强制要求，属于你应当据此撰写的目标结构，而非需要回避
      复制的原始规则文本本身。参考完整模板：openspec/templates/proposal-template.md
    - >-
      MANDATORY（仅约束机制/环境类变更包——守护本仓库流程/工具/协议自身的变更，不约束部门业务场景变更
      包）：proposal.md 必须在「Why」或独立小节内回答"本次退休哪一个既有守卫；若不能退，写明为何不能"，
      不得留空、不得以"无"搪塞而未论证。来源：协议〇.9 措施 B（队列 #308，2026-08-08），根治"规则只增
      不减、守卫代码本身没有退休制"（4822 行只增不减的实测数据见队列 #308）。区分机制类与业务类不新造
      判据，沿用本项目既有的自我归类＋design 审兜底惯例（同"档1-4 晋档口径"由作者自评、design 审核实）。
    - >-
      MANDATORY（伴生文件的 .gitignore 覆盖）：若本变更会让某个工具**自动生成**一种此前不存在的文件名
      形态——锁文件、快照、暂存、状态文件、日志、重命名退路产物、备份副本等——proposal.md 必须写明该
      文件名形态是否已被 `.gitignore` 覆盖，并给出核实方式（`git check-ignore -v` 的实际结果，不是"应该
      被覆盖"这类推断）。不适用时须写明为何不适用（如"本变更不新增任何自动生成文件"），不得跳过不答。
      来源：队列 #328 子项②（2026-08-17）。成因＝#322 为编辑锁加了"删不掉就改名"的退路，**改名这个动作
      凭空造出了一个此前不存在的文件名形态**（`*.editlock.mutex.stale`），而当时没有任何人回头看一眼忽略
      规则；`git check-ignore` 实测不命中 ⇒ 它被 `git status` 恒报为未跟踪、被 sweep 判为孤儿脏文件，
      企微群连响 17.1 小时，且因每个 session 每把锁都会再生而永不消失。**注意它与 one-in-one-out 的分工**：
      那条问"你删了哪个守卫"，本条问"你新造了哪种文件"——#322 当时两条都没被问到，所以两条都要在。
