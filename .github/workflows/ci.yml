name: CI 基线

# 队列 #309 步骤 2（CI 基线上线）。交付条件仍是步骤 3「退休等量 sweep
# 检查」，本文件只是步骤 2 本身，不代表 #309 已完工。
#
# 🔴 硬约束（步骤 1 实测坐实，配置前提非可选优化，详见
# 3-治理与合规/构建环境基建方案-CI基线与业务环境双队列-2026-08-08.md）：
# 测试作业必须逐子项目 `cd` 后独立跑 pytest，不得在仓库根一次性跑——
# 根目录一次性跑会因多个场景同名 `tests/test_golden.py` 等模块名冲突产生
# 20 个 collection error（pytest 无 `__init__.py` 时按 rootdir 相对路径
# 解析模块名，同名文件跨目录会撞）。已被两条外部评审建议否决：
# ①「先重构 20 个冲突文件」——前提是"存在真实盲区"，已证伪：逐子项目跑
# 时这些文件全部正常收集执行，不存在盲区，重构没有对应的真实问题要解决；
# ②「失败步骤挂企微 webhook 告警」——方向对但会新增第 9 类"只报出现不报
# 解除"的告警，须等 #308 子项 D1 的告警解除通用骨架落地后再建，本次不做。
#
# 步骤 1（2026-08-08，干净环境即本文件所依赖的这套 CI 本身、无 .env、无
# 内网 LAN）实测基线：13 个子项目，1698 passed / 46 skipped / 0 failed
# （本机早前一度误记为 1704/40，经真实 CI 复现坐实并勘误——QD-A/QD-B
# 各一处依赖真实立项书样本的测试在真正干净的环境下会跳过，本机早前的
# 记录环境不够干净；详见 `工具-CI覆盖率护栏.py` 头部"基线勘误"说明）。
# 见 `.github/ci-requirements.txt` 头部注释与队列 #309 行回填。
#
# 🔴 全局 PYTHONUTF8（首次真实跑通 CI 后实测坐实，非预防性配置）：
# `windows-latest` runner 的 Python stdout/stderr 默认编码是 cp1252（legacy
# Windows 代码页），本仓库大量脚本/测试直接 print 中文与 ✓/✗ 等 Unicode
# 符号（本地开发机 Windows 11 终端默认 UTF-8，从未暴露过这个问题）——
# 首次真实 CI 运行（gh run 31248705932）5 个作业全部因
# `UnicodeEncodeError: 'charmap' codec can't encode character...` 失败，
# 覆盖新增的两个 lint 脚本、`0-学习与工具` 套件里多个既有工具脚本，以及
# `zhuopin_platform`/`wecom-aibot-service` 两处"子进程预期 stderr 含中文
# fail-loud 文案"的测试（子进程自己先因同一个编码错误崩溃，产出的是
# Python Traceback 而不是预期的中文错误信息）。设为环境变量而非逐个脚本
# 改代码——同一个环境差异在这个仓库的体量下几乎必然继续在未覆盖到的脚本
# 里复现，在 CI 环境层面一次性设对，比追着每个新增的 print 语句修更彻底。
#
# 🔴 矩阵清单不再手写（步骤 2 追加设计输入，2026-08-08 Cowork「环境总线」
# 独立复核步骤 1 产出时发现并指出）：`discover-projects` job 用
# `工具-CI矩阵发现.py` 从 `git ls-files` 动态发现测试所在子项目，`test`
# job 的矩阵直接消费该发现结果——新场景（SC2/SC4/SC10/SC11、质量域
# 8D/IQC/SPC 等）建成后只要遵循既有的 `X/tests/test_*.py` 或
# `X/test_*.py` 命名约定，**不需要任何人记得手改这份清单**，这正是 CI
# 立项要消灭的"靠人记得"，不能在 CI 自己身上原样复活。
# 另加 `coverage-guardrail` job 作第二道独立防线（不依赖发现规则完美）：
# 汇总全部矩阵腿的 JUnit XML 报告，断言三条不随发现规则变化的硬下界
# ——总 passed≥1698／总 skipped≤46／参与矩阵的子项目数≥13，任一跌破即
# 红（哪怕发现规则本身出错导致"矩阵变短了但每腿都绿"这种静默失效，见
# 根 CLAUDE.md §5「工具静默回退」教训）。
env:
  PYTHONUTF8: "1"

"on":
  push:
  pull_request:

jobs:
  discover-projects:
    name: "CI 矩阵自动发现（替代手写清单，防隐性白名单，见文件头部说明）"
    runs-on: windows-latest
    outputs:
      projects: ${{ steps.discover.outputs.projects }}
      project_count: ${{ steps.discover.outputs.project_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - id: discover
        run: |
          $json = python 0-学习与工具/工具-CI矩阵发现.py
          $count = ($json | ConvertFrom-Json).Count
          echo "projects=$json" >> $env:GITHUB_OUTPUT
          echo "project_count=$count" >> $env:GITHUB_OUTPUT
          Write-Host "发现 $count 个子项目：$json"

  test:
    name: "测试 · ${{ matrix.project }}"
    runs-on: windows-latest
    needs: discover-projects
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.discover-projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: ".github/ci-requirements.txt"

      - name: 安装 CI 依赖闭包
        run: pip install -r .github/ci-requirements.txt

      # 平台底座包须以 editable 方式装入 CI 这个一次性 VM 才能被 8 个场景
      # 的 `import zhuopin_platform...` 解析到——本地开发机上"pip install -e
      # 可选"（队列 #300）成立，是因为 conftest.py 的 sys.path 引导 +
      # 本地历史上已 pip install -e 过的全局指针兜底；CI 是全新 VM、没有
      # 任何历史指针，且并不存在 #300 要规避的"多 worktree 共享同一全局
      # 指针"问题（每个 job 都是独立一次性 VM），故在这里直接装是安全、
      # 正确的选择，不与 #300 的结论冲突。--no-deps 是关键：平台
      # pyproject.toml 声明的 chromadb 依赖体积巨大（本地实测拉起
      # kubernetes-client/huggingface-hub/tokenizers/opentelemetry 等一整
      # 条传递依赖链，单独安装耗时数分钟），而 AST 扫描已确认 13 个子
      # 项目零处实际 import chromadb（见 `.github/ci-requirements.txt`
      # 头部说明）——只需要 zhuopin_platform 这个包本身可被导入，不需要
      # 它声明的第三方依赖（那些已经在上一步按实测需要的子集单独装过）。
      # 8 个场景自身的包（sc1-supplier-risk-screening 等）经实测**不需要**
      # 额外 `pip install -e`——pytest 对没有 `__init__.py` 的测试目录会把
      # 场景根目录（即 working-directory）本身插入 sys.path，场景内部的
      # 同目录导入（如 `from src.audit_log import ...`）已经解析得到，
      # 只有跨场景的 `zhuopin_platform` 才需要真正的已安装包。
      - name: 安装平台底座包（editable，--no-deps）
        run: pip install --no-deps -e "5-平台底座/zhuopin_platform"

      # 无 .env（checkout 天然不带，.env 系列全部 gitignore）、无内网 LAN
      # （GitHub 托管 runner 出不了公司内网），复刻步骤 1 的干净环境前提。
      # --junit-xml 产出结构化报告供 coverage-guardrail 聚合，比正则解析
      # "X passed, Y skipped" 这类自由格式摘要行更可靠（见该 job 说明）。
      - name: "cd 子项目后独立跑 pytest（不得在仓库根一次性跑，见文件头部说明）"
        working-directory: ${{ matrix.project }}
        run: python -m pytest -q --tb=short --junit-xml=pytest-result.xml

      - name: 上传测试结果供覆盖率 guardrail 聚合
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-result-${{ strategy.job-index }}
          path: ${{ matrix.project }}/pytest-result.xml
          retention-days: 7

  coverage-guardrail:
    name: "CI 覆盖率下界护栏（防矩阵/skip 数悄悄下滑）"
    runs-on: windows-latest
    needs: [discover-projects, test]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          pattern: pytest-result-*
          path: pytest-results
      - name: 汇总并断言下界（passed≥1698／skipped≤46／子项目数≥13）
        run: python 0-学习与工具/工具-CI覆盖率护栏.py --results-dir pytest-results

  openspec-validate:
    name: "openspec validate --all --strict"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: 安装 openspec CLI
        run: npm install -g @fission-ai/openspec@1.7.0
      - run: openspec validate --all --strict

  queue-structure-lint:
    name: "队列结构 lint（列数／裸竖线／§二状态列格式）"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python 0-学习与工具/工具-队列结构lint.py

  bootstrap-stub-lint:
    name: "平台底座引导样板 lint（非 stub 形态的内联引导即违规）"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # 队列 #345 第二步 / 变更包 platform-bootstrap-ensure-paths 决策点 4(a)：
      # 这道门禁是「退休 CLAUDE.md §5『新场景照抄既有引导片段』这条人守规则」欠下的
      # 对价——退休制要求挂到不可绕过的咽喉上，否则只是用一条人守换另一条人守，而
      # SC2（2026-08-18 新建）已证明人守在这里无效：规则被遵守了、结果仍是错的。
      # 直接上 --enforce 而非只告警：决策点 4 要求的"过渡期先跑一轮"已在本地对**全部
      # 已跟踪 .py**（与 CI 同一份 `git ls-files` 扫描面）跑过并按结果收窄了判据范围，
      # 收窄后存量命中数真实为 0；本 job 首次运行即为绿。若日后它变红，说明有人新写
      # 了带判断分支的内联引导——那正是它该拦下的事。
      - run: python 0-学习与工具/工具-引导样板lint.py --enforce

  secret-scan:
    name: "凭据扫描"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python 0-学习与工具/工具-密钥扫描lint.py
